meta:
  name: default-llm
  version: 1.0.0
  description: Configuración del LLM principal usado por los agentes del proyecto.
  updated_at: 2026-05-22
  author: kinofuente@ariaia.com

llm:
  provider: openai
  model: gpt-4.1
  temperature: 0
  # max_tokens: null   # déjalo descomentado solo si quieres limitar la salida
  # top_p: 1
  # timeout: 60

memory:
  # token_limit: máximo de tokens del historial antes de recortar mensajes viejos.
  # Para gpt-4.1 (ventana grande) puedes subirlo sin miedo; aquí dejamos algo conservador.
  token_limit: 3000
